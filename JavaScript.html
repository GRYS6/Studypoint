<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAVASCRIPT Tutoial</title>
    <link rel="stylesheet" href="project.css">
 <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

    <div class="topic-menu" onclick="toggleTopicMenu()">☰</div>

    <div class="subject-page">

        <!-- Sidebar -->
        <div class="s-sidebar">

            <h2>JS TOPICS</h2>

            <div id="topic-list">
                Loading topics...
            </div>

        </div>

        <!-- Content -->
        <div class="s-content" id="main-content">

            <h1>Loading...</h1>

        </div>

    </div>

    <script src="project.js"></script>

        <script>
    const API_BASE = "https://api-callstudy.onrender.com/api/view";

    // 1. New function to fetch and display a single note by ID
    async function fetchAndDisplayNote(id, title) {
        const mainContent = document.getElementById("main-content");
        
        // Show a loading state while fetching the detail API
        mainContent.innerHTML = `<h1>Loading ${title}...</h1>`; 

        try {
            const response = await fetch(`${API_BASE}/js/${id}`);
            const data = await response.json();

            if (data.success && data.note) {
                // Get the content (falling back to description just in case)
                const rawContent = data.note.content || data.note.description || "Content not found";
                
                // Parse the markdown into HTML using the marked library you imported
                const htmlContent = marked.parse(rawContent);

                mainContent.innerHTML = `
                <div class="content-card">
                    <h1>${data.note.title || title}</h1>
                    <div class="note-content">
                        ${htmlContent}
                    </div>
                </div>
                `;
            } else {
                mainContent.innerHTML = `<h2>Content not found</h2>`;
            }
        } catch (error) {
            console.error("Error fetching note details:", error);
            mainContent.innerHTML = `<h2>Error</h2><p>${error.message}</p>`;
        }
    }

    // 2. Updated list loading function
    async function loadTopics() {
        try {
            const response = await fetch(`${API_BASE}/js`);
            const data = await response.json();

            console.log("API Response (List):", data);

            const topicList = document.getElementById("topic-list");
            topicList.innerHTML = "";

            const notes = data.notes || [];

            notes.forEach((note, index) => {
                const link = document.createElement("a");
                link.href = "#";
                link.textContent = note.title || "Untitled";

                // Update the click handler
                link.onclick = function(e) {
                    e.preventDefault();

                    // Purani active class hatao
                    document.querySelectorAll("#topic-list a").forEach(a => {
                        a.classList.remove("active");
                    });

                    // Current topic active karo
                    this.classList.add("active");

                    // FETCH the detail content using the new function
                    fetchAndDisplayNote(note.id, note.title);
                };

                topicList.appendChild(link);

                // 3. Auto-load the first note's content when the page initially loads
                if (index === 0) {
                    link.classList.add("active");
                    fetchAndDisplayNote(note.id, note.title);
                }
            });

            if (notes.length === 0) {
                document.getElementById("main-content").innerHTML = `<h2>No topics found.</h2>`;
            }

        } catch (error) {
            console.error("Error fetching topics:", error);
            document.getElementById("main-content").innerHTML = `<h2>Error</h2><p>${error.message}</p>`;
        }
    }

    // Start the process
    loadTopics();
        </script>

</body>

</html>
