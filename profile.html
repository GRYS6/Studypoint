<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile - Studypoint</title>

<link rel="stylesheet" href="project.css">
<link rel="stylesheet" href="profileStyles.css">

</head>
<body>

<!-- Navbar -->
<header class="navbar">

    <div class="menu-icon" onclick="openMenu()">☰</div>

    <a href="index.html" class="logo">
        Studypoint
    </a>

    <div class="auth">
        <a href="profile.html" class="login">
            Profile
        </a>

        <button onclick="logout()" class="register">
            Logout
        </button>
    </div>

</header>

<!-- Sidebar -->
<div id="sidebar" class="sidebar">
    <a href="#">Home</a>
    <a href="about.html">About</a>
    <a href="#">Courses</a>
    <a href="/Studypoint/batch_2/fy/s2/subject/dbms_t/introduction">Tutors</a>
    <a href="#">Contact</a>
     <a href="quiz.html">QUIZ</a>
    <a href="profile.html">profile</a>
    
  </div>
  

<!-- Profile -->

<div class="profile-container">

<div class="profile-content">

<!-- Header -->

<div class="profile-header">

<div class="profile-avatar" id="userAvatar">
👤
</div>

<div class="profile-name" id="userName">
Student
</div>

<div class="profile-email" id="userEmail">
student@gmail.com
</div>

</div>

<!-- Tabs -->

<div class="profile-tabs">

<button class="tab-btn active"
onclick="switchTab(event,'overview')">
Overview
</button>

<button class="tab-btn"
onclick="switchTab(event,'progress')">
Progress
</button>

<button class="tab-btn"
onclick="switchTab(event,'settings')">
Settings
</button>

</div>

<!-- Overview -->

<div id="overview"
class="tab-content active">

<div class="profile-section">

<h2>Personal Information</h2>

<div class="info-row">
<div class="info-label">Full Name</div>
<div class="info-value" id="fullName"></div>
</div>

<div class="info-row">
<div class="info-label">Email</div>
<div class="info-value" id="email"></div>
</div>

<div class="info-row">
<div class="info-label">College</div>
<div class="info-value" id="college"></div>
</div>

<div class="info-row">
<div class="info-label">Course</div>
<div class="info-value" id="course"></div>
</div>

<div class="info-row">
<div class="info-label">Phone</div>
<div class="info-value" id="phone"></div>
</div>

<button class="edit-btn"
onclick="openEditModal()">
Edit Profile
</button>

</div>

<!-- Quiz Statistics -->

<div class="profile-section">

<h2>Quiz Statistics</h2>

<div class="stats-grid">

<div class="stat-card">
<div class="stat-number"
id="quizTaken">
0
</div>
<div class="stat-label">
Quizzes Taken
</div>
</div>

<div class="stat-card">
<div class="stat-number"
id="highestScore">
0
</div>
<div class="stat-label">
Highest Score
</div>
</div>

<div class="stat-card">
<div class="stat-number"
id="averageScore">
0%
</div>
<div class="stat-label">
Average Score
</div>
</div>

<div class="stat-card">
<div class="stat-number"
id="notesRead">
0
</div>
<div class="stat-label">
Notes Read
</div>
</div>

</div>

</div>

</div>

<!-- Progress -->

<div id="progress"
class="tab-content">

<div class="profile-section">

<h2>Learning Progress</h2>

<div id="subjectProgressContainer"
class="subject-progress">

</div>

</div>

</div>

<!-- Settings -->

<div id="settings"
class="tab-content">

<div class="profile-section">

<h2>Preferences</h2>

<div class="setting-item">

<div class="setting-label">
Dark Mode
</div>

<div class="toggle-switch"
onclick="toggleDarkMode(this)">

<div class="toggle-slider"></div>

</div>

</div>

</div>

</div>

</div>

</div>

<!-- Edit Modal -->

<div id="editModal"
class="modal">

<div class="modal-content">

<span class="modal-close"
onclick="closeEditModal()">
&times;
</span>

<h2>Edit Profile</h2>

<form onsubmit="saveProfile(event)">

<div class="form-group">
<label>Full Name</label>
<input type="text"
id="editName"
required>
</div>

<div class="form-group">
<label>Email</label>
<input type="email"
id="editEmail"
required>
</div>

<div class="form-group">
<label>College</label>
<input type="text"
id="editCollege">
</div>

<div class="form-group">
<label>Course</label>
<input type="text"
id="editCourse">
</div>

<div class="form-group">
<label>Phone</label>
<input type="text"
id="editPhone">
</div>

<div class="form-group">
<label>Avatar Emoji</label>
<input type="text"
id="editAvatar"
maxlength="2">
</div>

<div class="form-buttons">

<button type="submit"
class="save-btn">
Save
</button>

<button type="button"
class="cancel-btn"
onclick="closeEditModal()">
Cancel
</button>

</div>

</form>

</div>

</div>

<script src="project.js"></script>
<script src="profileScript.js"></script>

</body>
</html>
